name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby_version }}, Rails ${{ matrix.rails_version }}
    strategy:
      fail-fast: false
      matrix:
        rails_version: ['7.0', '7.1', '7.2', '8.0', 'main']
        ruby_version: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4']
        exclude:
          - rails_version: '7.2'
            ruby_version: '2.7'
          - rails_version: '7.2'
            ruby_version: '3.0'
          - rails_version: '8.0'
            ruby_version: '2.7'
          - rails_version: '8.0'
            ruby_version: '3.0'
          - rails_version: '8.0'
            ruby_version: '3.1'
          - rails_version: 'main'
            ruby_version: '2.7'
          - rails_version: 'main'
            ruby_version: '3.0'
          - rails_version: 'main'
            ruby_version: '3.1'
    env:
      BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails_version }}.gemfile
    steps:
    - uses: actions/checkout@v2
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}
        bundler-cache: true
    - name: Run the default task
      run: |
        bundle exec rake
      env:
        RAILS_VERSION: ${{ matrix.rails_version }}
